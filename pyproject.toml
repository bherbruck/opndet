[project]
name = "opndet"
version = "0.1.0"
description = "Tiny single-class object detector. OpenVINO 2022 opset compatible. No NMS."
requires-python = ">=3.10"
dependencies = [
    # Major-pinned to stop bleeding-edge breakage from Colab base-image rolls.
    # `~=X.Y` means `>=X.Y, <X+1` (PEP 440 "compatible release", pip's closest
    # analog to Cargo/Poetry's `^`). Explicit `>=X, <Y` used where we need to
    # block a specific bad release below the next-major boundary.
    # See docs/engineering-decisions.md "Dep pinning" for the why.
    "torch >= 2.0, < 2.12",            # 2.11 current; block 2.12 until validated
    "numpy >= 1.24, < 3",              # lap supports both 1.x and 2.x; no scipy chain
    "lap >= 0.5.13",                   # tiny C-compiled Hungarian; replaces scipy
    "onnx ~= 1.14",                    # >= 1.14, < 2
    "onnxruntime ~= 1.16",             # >= 1.16, < 2
    "onnxscript >= 0.1, < 2",
    "pillow >= 10.0, < 12",            # 12+ broke gradio + others; not worth chasing
    "opencv-python-headless ~= 4.8",   # >= 4.8, < 5
    "pyyaml ~= 6.0",                   # >= 6.0, < 7
    "tensorboard >= 2.13",             # train.py falls back to no-op writer if import fails
    "tqdm ~= 4.65",                    # >= 4.65, < 5
    "matplotlib ~= 3.6",               # >= 3.6, < 4
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "poethepoet>=0.30", "pre-commit>=3.7"]
video = ["yt-dlp>=2026.6.9", "imageio[ffmpeg]>=2.30"]
dashboard = ["duckdb>=1.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1"]

[project.scripts]
opndet = "opndet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opndet = ["configs/*.yaml", "dashboard_static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Task runner — `uv run poe <task>` (poethepoet is in the `dev` extra).
[tool.poe.tasks]
build-dashboard = { cmd = "bash scripts/build_dashboard.sh", help = "Build the dashboard SPA into src/opndet/dashboard_static/" }
dev-dashboard   = { cmd = "bun run dev", cwd = "frontend", help = "Vite dev server (proxies /api + /files to a running `opndet dashboard`)" }
test            = { cmd = "pytest tests/", help = "Run the Python test suite" }
lint            = { cmd = "ruff check src tests", help = "Lint Python sources" }
