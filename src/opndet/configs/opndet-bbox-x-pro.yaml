# opndet-bbox-x-pro: kitchen-sink-of-everything flagship variant.
#
# PHASE 4b — OBB output contract (ROADMAP §1.8 / §2.1):
#   - SPPF block at p4 (deepest backbone stage)
#   - PAFPN neck: top-down + bottom-up + final fuse-back-to-stride-4
#   - Decoupled head: parallel cls + reg ConvBnAct branches off nout
#   - OBB regression: raw[:,1:5] = (l, t, r, b) AABB; raw[:,5:7] = (sin2θ, cos2θ)
#
# Output: [1, 7, H/4, W/4] = (obj_peak, l, t, r, b, sin2θ, cos2θ). l/t/r/b
# are sigmoid distances to the OBB-enclosing AABB; sin2θ/cos2θ are
# tanh-bounded angle channels. Use decode_obb() at inference.
#
# Tier: server. Phase 2: C2PSA at p4 (post-SPPF) + matching neck (b4) stage.
# Free to use SiLU, attention, half-pixel resize.

model:
  tier: server
  in_ch: 3
  img_h: 384
  img_w: 512
  layers:
    - {name: stem, from: 0,    module: ConvBnAct, args: {in_ch: 3,   out_ch: 80,  k: 3, s: 2}}
    - {name: p1,   from: stem, module: CSPBlock,  args: {in_ch: 80,  out_ch: 160, n: 2, s: 2}}
    - {name: p2,   from: p1,   module: CSPBlock,  args: {in_ch: 160, out_ch: 320, n: 4, s: 2}}
    - {name: p3,   from: p2,   module: CSPBlock,  args: {in_ch: 320, out_ch: 512, n: 6, s: 2}}
    - {name: p4,   from: p3,   module: CSPBlock,  args: {in_ch: 512, out_ch: 640, n: 4, s: 2}}

    # SPPF: widen receptive field at the deepest stage (opset-13 safe: Conv+MaxPool+Concat).
    - {name: p4s,  from: p4,   module: SPPF,      args: {in_ch: 640, out_ch: 640, k: 5}}

    # C2PSA: position self-attention on the deepest backbone stage. Server-tier only.
    - {name: p4_attn, from: p4s, module: C2PSA,    args: {in_ch: 640, num_heads: 4}}

    # Top-down lateral 1x1s (project all stages to neck width).
    - {name: lat4, from: p4_attn, module: ConvBnAct, args: {in_ch: 640, out_ch: 256, k: 1}}
    - {name: lat3, from: p3,   module: ConvBnAct, args: {in_ch: 512, out_ch: 256, k: 1}}
    - {name: lat2, from: p2,   module: ConvBnAct, args: {in_ch: 320, out_ch: 256, k: 1}}
    - {name: lat1, from: p1,   module: ConvBnAct, args: {in_ch: 160, out_ch: 256, k: 1}}

    # Top-down path: t4 → t3 → t2 → t1 (each step upsamples 2x and adds the lateral).
    - {name: t4,   from: lat4,        module: Identity,        args: {}}
    - {name: u4,   from: t4,          module: ResizeNearest2x, args: {}}
    - {name: a3,   from: [u4, lat3],  module: Add,             args: {}}
    - {name: t3,   from: a3,          module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: u3,   from: t3,          module: ResizeNearest2x, args: {}}
    - {name: a2,   from: [u3, lat2],  module: Add,             args: {}}
    - {name: t2,   from: a2,          module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: u2,   from: t2,          module: ResizeNearest2x, args: {}}
    - {name: a1,   from: [u2, lat1],  module: Add,             args: {}}
    - {name: t1,   from: a1,          module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}

    # Bottom-up path: b2 ← t1, b3 ← b2, b4 ← b3 (each step downsamples 2x with ConvBnAct stride=2 and adds the top-down feature).
    - {name: d1,   from: t1,          module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3, s: 2}}
    - {name: ab2,  from: [d1, t2],    module: Add,             args: {}}
    - {name: b2,   from: ab2,         module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: d2,   from: b2,          module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3, s: 2}}
    - {name: ab3,  from: [d2, t3],    module: Add,             args: {}}
    - {name: b3,   from: ab3,         module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: d3,   from: b3,          module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3, s: 2}}
    - {name: ab4,  from: [d3, t4],    module: Add,             args: {}}
    - {name: b4,   from: ab4,         module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    # C2PSA on the matching neck stage at p4 stride. Server-tier only.
    - {name: b4_attn, from: b4,       module: C2PSA,           args: {in_ch: 256, num_heads: 4}}

    # Bring b4 back to stride 4 via three nearest-2x upsamples and fuse with t1.
    - {name: b4u1, from: b4_attn,     module: ResizeNearest2x, args: {}}
    - {name: b4u2, from: b4u1,        module: ResizeNearest2x, args: {}}
    - {name: b4u3, from: b4u2,        module: ResizeNearest2x, args: {}}
    - {name: nadd, from: [t1, b4u3],  module: Add,             args: {}}
    - {name: nout, from: nadd,        module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}

    # Decoupled head: parallel cls + reg branches.
    - {name: cls1, from: nout, module: ConvBnAct, args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: cls2, from: cls1, module: ConvBnAct, args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: cls,  from: cls2, module: Conv,      args: {in_ch: 256, out_ch: 1, k: 1, bias_init: -2.19}}

    - {name: reg1, from: nout, module: ConvBnAct, args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: reg2, from: reg1, module: ConvBnAct, args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: reg,  from: reg2, module: Conv,      args: {in_ch: 256, out_ch: 6, k: 1}}

    - {name: raw,  from: [cls, reg], module: Concat, args: {dim: 1}}

    - {name: obj_r, from: raw,   module: SplitChannels,       args: {start: 0, end: 1}}
    - {name: soft_obj, from: obj_r, module: Sigmoid,          args: {}}

    - {name: obj,    from: obj_r, module: SigmoidPeakSuppress, args: {k: 7, eps: 5.0e-3}}
    - {name: ltrb_r, from: raw,   module: SplitChannels,       args: {start: 1, end: 5}}
    - {name: ltrb,   from: ltrb_r, module: Sigmoid,            args: {}}
    - {name: ang_r,  from: raw,   module: SplitChannels,       args: {start: 5, end: 7}}
    - {name: angle,  from: ang_r, module: Tanh,                args: {}}
    - {name: out,    from: [obj, ltrb, angle], module: Concat, args: {dim: 1}}

  outputs:
    - {name: output, from: out, activation: none}
