# Minimum-viable opndet train.yaml — everything not specified inherits sane per-preset
# defaults from src/opndet/training_defaults.py (LR scales with model size, aug profile
# scales with capacity, etc).  Run `opndet info` to see all presets.

runs_dir: runs
name: exp1

model_config: bbox-s          # bbox-f | bbox-p | bbox-n | bbox-s | bbox-m
                              # bbox-l | bbox-x | bbox-h | bbox-g | bbox-t   (and -dist variants)
# model:
#   stride: 4                 # output stride (default 4)
#   img_h: 384                # override the preset's input height (default per-preset; 384 for most)
#   img_w: 512                # override the preset's input width  (default per-preset; 512 for most)
#                             #   Net is fully conv + nearest-Resize → any size divisible by the
#                             #   backbone's deepest stride works; use multiples of 32 (e.g. 480x640).
#                             #   Applied identically by train, eval, calibrate. A bad size fails
#                             #   at the first forward.

data:
  sources:
    - {coco: data/site_a/_annotations.coco.json, images: data/site_a}
  # split_ratios: [0.8, 0.1, 0.1]   # default
  # image_filter: data/scenario1.txt  # text file of image names (basename or stem,
                                       # one per line, # comments ok). Keeps only
                                       # those images across all sources. Omit /
                                       # empty file = use everything. Applies the
                                       # same way for train, eval, calibrate.

epochs: 100

# Common overrides users actually want to set. Uncomment any to override the per-preset defaults.
#
# patience: 30
# patience_smart: true            # default true — won't stop while any tracked val metric improves
# patience_include_test: false    # also count test metrics in the patience clock — slightly leaky
                                  #   (test influences WHEN to stop, not WHAT to save). Useful when
                                  #   test trajectory is still climbing while val plateaus.
# metric_for_best: f1_opt_cal     # default — selects best.pt by calibrated F1 at auto-detected threshold
#   Other selectable values:
#     f1, map50, map_50_95, f1_opt          (raw, no temperature applied)
#     f1_cal, map50_cal, map_50_95_cal      (post-calibration)
#     center_f1, center_recall              (IoU-free; "all objects found near
#                                            their centers, no false positives" —
#                                            best for production-style KPIs where
#                                            box shape doesn't matter much)
#
# batch_size: 64                  # default scales with size: f/p=256, s/n=128, m/l=64, x=32, h/g/t=16
# lr: 3.0e-3                      # default scales: bbox-m=3e-3, halves per ~4x params (bbox-x=1.5e-3, bbox-t=5e-4)
# warmup_steps: 200               # default 200, bigger sizes get longer
#
# optimizer: adamw                # default. server-tier -pro presets may opt into 'musgd'
#                                 #   (Muon for hidden conv weights + AdamW for biases/BN/heads,
#                                 #   per YOLO26). Vision wins unproven — validate before promoting.
# muon_momentum: 0.95             # only used when optimizer=musgd
# muon_lr_scale: 1.0              # multiplier on lr for the Muon leg (AdamW leg uses lr directly)
#
# eval_cold_start: false          # 4-ch only. When true, runs a SECOND val (and
#                                 #   test) pass with zero priors, logged as
#                                 #   val_cold/* and test_cold/*. Useful diagnostic
#                                 #   for "how much is the prior actually helping?"
#                                 #   Selection metric still uses the warm pass.
#
# viz_only_on_improvement: true   # default true — skip val/preds + test/* on
#                                 #   plateaued epochs (best.pt didn't move since
#                                 #   last fire). Boundary epochs (1, epochs) and
#                                 #   new-best epochs always fire. Saves test-eval
#                                 #   compute and keeps TB image logs sparse-but-meaningful.
# vis_samples: 4                  # default 4 — image grid count for val/preds
# vis_every: 5                    # default 5 — log image grid every N epochs
# vis_threshold: 0.05             # default "auto": when metric_for_best is f1_opt*, tracks the
                                  #   per-epoch threshold_opt so the grid matches the model's
                                  #   actual deployment threshold. Otherwise falls back to
                                  #   eval_threshold. Set a number to override.
# test_samples: 4
# test_every: 0                   # default 0 — test eval at end only; >0 logs test/* every N epochs
#
# calibrate_every: 1              # default 1 — fits T per epoch + recomputes calibrated metrics
# auto_calibrate: true            # default true — final auto-calibrate at end of training
# auto_bundle: true               # default true — zip run dir at end (skips tfevents). On Colab,
#                                 #   also triggers files.download() automatically.
# bundle_include_tb: false        # default false — set true to include tfevents in the zip (big)
#
# metrics_db: true                # default true — write a queryable DuckDB store at
#                                 #   <out_dir>/metrics.duckdb alongside TB. Backs the
#                                 #   `opndet dashboard` viewer.
# dashboard: false                # set true to auto-spawn the dashboard FastAPI server
#                                 #   on training start. In Colab it embeds as an iframe
#                                 #   in the calling cell. Subprocess gets cleaned up at exit.
# dashboard_port: 5000            # bind port for the auto-spawned dashboard
#
# hm_target: gaussian             # objectness GT shape. "gaussian" (default) = the CornerNet bump
#                                 #   (or, if hm_blob_frac > 0, an oriented elliptical Gaussian).
#                                 #   "ellipse" = a domed ellipse FITTED to the GT box: 1.0 at the
#                                 #   center, linearly ramping to 0 at the box's inscribed-ellipse
#                                 #   boundary, 0 in the box corners and beyond, rotated by θ. The
#                                 #   raw heatmap then reads like a soft segmentation, AND — unlike a
#                                 #   Gaussian whose tail never reaches 0 — it hits exactly 0 at the
#                                 #   object edge, so it does NOT bleed into the gaps between touching
#                                 #   objects (the right choice for crowded scenes). Pair with
#                                 #   cls_loss: soft_hm so the model regresses the whole ramp.
# hm_ellipse_edge_margin: 0.1     # (hm_target: ellipse only) objects whose box comes within this
#                                 #   fraction of any image edge fall back to a plain Gaussian —
#                                 #   the visible chunk of a clipped object isn't egg-shaped, so
#                                 #   rendering a clean ellipse for it would put the peak wrong. 0 = off.
# hm_blob_frac: 0.0               # (hm_target: gaussian only) >0 → oriented elliptical Gaussian with
#                                 #   σ ≈ hm_blob_frac·{w,h}/stride. Object-shaped-ish, but the tail
#                                 #   bleeds into gaps between touching objects → keep modest, or
#                                 #   prefer hm_target: ellipse which doesn't have that problem.
#
# loss:
#   wh_loss: ciou                 # default
#   cls_loss: vfl                 # default — bimodal confidence. Also: focal | soft_hm.
#                                 #   soft_hm = Quality Focal Loss toward the FULL Gaussian → the
#                                 #   model learns an object-shaped objectness dome (not a 1-cell
#                                 #   nipple). Best with hm_blob_frac > 0. (vfl had cold-start
#                                 #   collapse on zero-IoU positives; focal/soft_hm don't.)
#   qfl_beta: 2.0                 # focal exponent for soft_hm only
#   count_weight: 0.05            # >0 enables count-aware loss term
#   convexity_weight: 0.2         # >0 enforces centered, radially-symmetric peaks (convex-object prior)
#   convexity_radius: auto        # CAP on the per-object convexity window (heatmap cells). The
#                                 #   window is already box-derived per object and auto-scales; this
#                                 #   just needs to be ≥ the biggest object's radius so it never
#                                 #   clamps. "auto" (the default) sizes it from the dataset's p99 GT
#                                 #   box (capped at 12 for VRAM). Set a number to pin it.
#   repulsion_weight: 0.5         # >0 for crowded touching objects
#   peak_sharpen_weight: 0.0      # >0 → at each GT cell, force the strongest neighbor within the
#                                 #   peak_kernel window ≥ peak_sharpen_margin BELOW the peak. Stops
#                                 #   the model hedging two ~equal adjacent cells (true center on a
#                                 #   cell boundary) → PeakSuppress then fully zeroes the neighbor →
#                                 #   no "two touching detections" duplicate (the lower one only
#                                 #   *looks* far less confident — the arith mask amplifies a tiny
#                                 #   heatmap difference). Heatmap-side analog of repulsion; 0 inference cost.
#   peak_sharpen_margin: 0.15     # the gap to enforce — must be >> the PeakSuppress eps (5e-3)
#
# auto_mine:                      # auto hard-negative mining DURING training (off unless set).
#   enabled: true                 #   Every `every` epochs (after `start_epoch`), or whenever the
#   start_epoch: 60               #   center-ghost rate crosses `ghost_rate_gate`, run the model on
#   every: 10                     #   a data slice, take objectness peaks >= `threshold` whose
#   threshold: 0.5                #   center isn't near any GT, crop a patch around each, and feed
#   ghost_rate_gate: 2.0          #   them back via the hard-negative paste pool (auto-wired to
#   source: val                   #   <out_dir>/hard_negatives). >1 disables the rate gate.
#   max_pool: 500                 #   pool is FIFO-capped (oldest patches age out)
#   max_scan: 400                 #   images scanned per mine pass
#   top_k_per_sample: 4           #   max patches per image
#   patch_size: auto              #   crop size (px). "auto" (default) = median GT box short-side.
#   ghost_radius_frac: 0.5        #   a pred counts as a ghost if its center is outside
#                                 #   max(8px, 2·stride, this·min(gt_w,gt_h)) of EVERY GT center.
#                                 #   Lower it (~0.3) to catch phantoms that sit *between* real
#                                 #   objects (e.g. an "egg" hallucinated in the gap between 4 eggs)
#                                 #   rather than forgiving them as slightly-off detections.
#   paste_prob: 0.2               #   per-sample probability the dataloader pastes a mined patch
#   paste_count: 1                #   patches pasted per sample when it fires
#   WARNING: start_epoch matters — mining before the cls head knows what objects
#   look like teaches it to suppress real-but-not-yet-learned objects → recall
#   collapse. Don't start until the heatmap loss has converged.
#
# augment:                        # full per-tier defaults already set; override here if needed
#   scale_jitter: [0.7, 1.3]      # random zoom about the image center (affine, no rotation →
#                                 #   OBB-SAFE: θ is invariant under uniform scale, w,h scale by it).
#                                 #   [1.0, 1.0] = off. Boxes that slide (mostly) off-frame are
#                                 #   dropped via min_visible_frac. (OBB presets ship with this off
#                                 #   — set it here to enable; unlike hflip/rot90 it's fine for OBB.)
#   translate_frac: 0.1           # random shift, fraction of img dim (each axis). 0 = off.
#   mosaic_prob: 0.0              # bbox-f/p default; bbox-s+ default 0.1; bbox-h+ default 0.3
#   cutout_prob: 0.0
#   temporal_prior:               # auto-on when model_config has in_ch:4 (e.g. bbox-f-tp).
#     n_max: 8                    #   max history length sampled per sample
#     motion_speed_range: [2.0, 15.0]  # px/frame (input coords)
#     confidence_range: [0.5, 0.95]    # per-frame stamp confidence
#     object_drop_prob: 0.05      # per-frame-per-object detection-miss
#     object_skip_prob: 0.0       # per-object total exclusion (brand-new object)
#     margin_top: 0.0             # boxes within this fraction of an edge get NO prior —
#     margin_bottom: 0.0          #   models "just-appeared" objects at the entry edge.
#     margin_left: 0.0            #   E.g. for a top-fed conveyor: margin_top: 0.05.
#     margin_right: 0.0
#     false_positive_prob: 0.10   # 1-3 random low-amp stamps per sample at this rate
#     spawn_zone_prob: 0.10       # frame-edge static prior at this rate
#     zero_prior_prob: 0.05       # cold-start coverage beyond N=0
#
# distill:                        # used only with --teacher PATH or --self-distill on the CLI
#   hm_weight: 1.0                # default; bumped to 1.5 for tiny students (auto)
#   reg_weight: 0.5               # default; bumped to 0.75 for tiny students (auto)
#   conf_gate: 0.5
#   full_distill: false           # true: BCE on every cell (anti-FP supervision)
#   neg_gate: 0.0                 # asymmetric mode when >0
#   kd_temperature: 1.0
