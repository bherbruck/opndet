# opndet-bbox-p-pro: kitchen-sink-of-everything flagship variant.
#
# PHASE 1 — Bedrock architecture refresh (ROADMAP §1.8):
#   - SPPF block at p4
#   - PAFPN neck (top-down + bottom-up + final fuse-back-to-stride-4)
#   - Decoupled head (parallel cls + reg branches off nout)
#   - ltrb regression (raw[:,1:5] = (l, t, r, b), image-normalized in [0,1])
#
# Output: [1, 5, H/4, W/4] = (obj_peak, l, t, r, b). Use decode_ltrb() at inference.
#
# Tier: edge. opset-13 + Myriad-VPU safe. NO SiLU, NO attention, NO half_pixel resize.

model:
  in_ch: 3
  img_h: 384
  img_w: 512
  layers:
    - {name: stem, from: 0,    module: ConvBnAct, args: {in_ch: 3,   out_ch: 8,   k: 3, s: 2}}
    - {name: p1,   from: stem, module: CSPBlock,  args: {in_ch: 8,   out_ch: 16,  n: 1, s: 2}}
    - {name: p2,   from: p1,   module: CSPBlock,  args: {in_ch: 16,  out_ch: 32,  n: 1, s: 2}}
    - {name: p3,   from: p2,   module: CSPBlock,  args: {in_ch: 32,  out_ch: 48,  n: 1, s: 2}}
    - {name: p4,   from: p3,   module: CSPBlock,  args: {in_ch: 48,  out_ch: 64,  n: 1, s: 2}}

    - {name: p4s,  from: p4,   module: SPPF,      args: {in_ch: 64,  out_ch: 64, k: 5}}

    - {name: lat4, from: p4s,  module: ConvBnAct, args: {in_ch: 64,  out_ch: 24, k: 1}}
    - {name: lat3, from: p3,   module: ConvBnAct, args: {in_ch: 48,  out_ch: 24, k: 1}}
    - {name: lat2, from: p2,   module: ConvBnAct, args: {in_ch: 32,  out_ch: 24, k: 1}}
    - {name: lat1, from: p1,   module: ConvBnAct, args: {in_ch: 16,  out_ch: 24, k: 1}}

    - {name: t4,   from: lat4,        module: Identity,        args: {}}
    - {name: u4,   from: t4,          module: ResizeNearest2x, args: {}}
    - {name: a3,   from: [u4, lat3],  module: Add,             args: {}}
    - {name: t3,   from: a3,          module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: u3,   from: t3,          module: ResizeNearest2x, args: {}}
    - {name: a2,   from: [u3, lat2],  module: Add,             args: {}}
    - {name: t2,   from: a2,          module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: u2,   from: t2,          module: ResizeNearest2x, args: {}}
    - {name: a1,   from: [u2, lat1],  module: Add,             args: {}}
    - {name: t1,   from: a1,          module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}

    - {name: d1,   from: t1,          module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3, s: 2}}
    - {name: ab2,  from: [d1, t2],    module: Add,             args: {}}
    - {name: b2,   from: ab2,         module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: d2,   from: b2,          module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3, s: 2}}
    - {name: ab3,  from: [d2, t3],    module: Add,             args: {}}
    - {name: b3,   from: ab3,         module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: d3,   from: b3,          module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3, s: 2}}
    - {name: ab4,  from: [d3, t4],    module: Add,             args: {}}
    - {name: b4,   from: ab4,         module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}

    - {name: b4u1, from: b4,          module: ResizeNearest2x, args: {}}
    - {name: b4u2, from: b4u1,        module: ResizeNearest2x, args: {}}
    - {name: b4u3, from: b4u2,        module: ResizeNearest2x, args: {}}
    - {name: nadd, from: [t1, b4u3],  module: Add,             args: {}}
    - {name: nout, from: nadd,        module: ConvBnAct,       args: {in_ch: 24, out_ch: 24, k: 3}}

    - {name: cls1, from: nout, module: ConvBnAct, args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: cls2, from: cls1, module: ConvBnAct, args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: cls,  from: cls2, module: Conv,      args: {in_ch: 24, out_ch: 1, k: 1, bias_init: -2.19}}

    - {name: reg1, from: nout, module: ConvBnAct, args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: reg2, from: reg1, module: ConvBnAct, args: {in_ch: 24, out_ch: 24, k: 3}}
    - {name: reg,  from: reg2, module: Conv,      args: {in_ch: 24, out_ch: 4, k: 1}}

    - {name: raw,  from: [cls, reg], module: Concat, args: {dim: 1}}

    - {name: obj_r, from: raw,   module: SplitChannels,       args: {start: 0, end: 1}}
    - {name: soft_obj, from: obj_r, module: Sigmoid,          args: {}}

    - {name: obj,   from: obj_r, module: SigmoidPeakSuppress, args: {k: 5, eps: 5.0e-3}}
    - {name: ltrb_r, from: raw,  module: SplitChannels,       args: {start: 1, end: 5}}
    - {name: ltrb,   from: ltrb_r, module: Sigmoid,           args: {}}
    - {name: out,    from: [obj, ltrb], module: Concat,       args: {dim: 1}}

  outputs:
    - {name: output, from: out, activation: none}
