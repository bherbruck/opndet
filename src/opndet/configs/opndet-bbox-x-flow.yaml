# opndet-bbox-x-flow: bbox-x backbone+neck, CellPose-style 4-channel
# flow-field head. NOT OpenVINO-compatible by design — decode does flow-
# field integration in PyTorch. Target: server/GPU deployment for the
# touching-objects case where peak-suppress on (obj, radius) fails.
#
# Output channels:
#   0  cell_prob (sigmoid)        — pixel-wise "is this part of an object"
#   1  flow_y    (tanh, [-1, 1])  — gradient toward object center
#   2  flow_x    (tanh, [-1, 1])
#   3  log_radius (sigmoid)       — bbox size at peak/centroid (optional;
#                                   informational, decode uses pixel set extent)
#
# Decode (PyTorch, not in graph):
#   1. Threshold cell_prob -> candidate pixel set
#   2. Euler-integrate the flow field for ~32 steps per candidate pixel
#   3. Cluster pixels by terminal attractor -> instance labels
#   4. Per-instance bbox from xy extents; refined by log_radius if useful
#
# Targets (need SAM-derived per-object segmentation masks; bbox-only
# annotations don't carry enough info for flow loss):
#   - cell_prob: 1 inside any mask, 0 outside
#   - flow_y/x: gradient of the per-pixel signed distance INSIDE its
#     instance's mask, normalized so each vector has magnitude <= 1
#   - log_radius: log(sqrt(mask_area / pi)) at the centroid pixel only
#
# Loss:
#   cell_prob  -> BCE/focal vs binary mask target
#   flow_y/x   -> L2 vs target flow vectors (only inside mask)
#   log_radius -> L1 at centroid pixels only

model:
  in_ch: 3
  img_h: 384
  img_w: 512
  layers:
    - {name: stem, from: 0,    module: ConvBnAct, args: {in_ch: 3,   out_ch: 80,  k: 3, s: 2}}
    - {name: p1,   from: stem, module: CSPBlock,  args: {in_ch: 80,  out_ch: 160, n: 2, s: 2}}
    - {name: p2,   from: p1,   module: CSPBlock,  args: {in_ch: 160, out_ch: 320, n: 4, s: 2}}
    - {name: p3,   from: p2,   module: CSPBlock,  args: {in_ch: 320, out_ch: 512, n: 6, s: 2}}
    - {name: p4,   from: p3,   module: CSPBlock,  args: {in_ch: 512, out_ch: 640, n: 4, s: 2}}

    - {name: lat4, from: p4,   module: ConvBnAct, args: {in_ch: 640, out_ch: 256, k: 1}}
    - {name: lat3, from: p3,   module: ConvBnAct, args: {in_ch: 512, out_ch: 256, k: 1}}
    - {name: lat2, from: p2,   module: ConvBnAct, args: {in_ch: 320, out_ch: 256, k: 1}}
    - {name: lat1, from: p1,   module: ConvBnAct, args: {in_ch: 160, out_ch: 256, k: 1}}

    - {name: up4,   from: lat4,        module: ResizeNearest2x, args: {}}
    - {name: add3,  from: [up4, lat3], module: Add,             args: {}}
    - {name: fuse3, from: add3,        module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: up3,   from: fuse3,       module: ResizeNearest2x, args: {}}
    - {name: add2,  from: [up3, lat2], module: Add,             args: {}}
    - {name: fuse2, from: add2,        module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}
    - {name: up2,   from: fuse2,       module: ResizeNearest2x, args: {}}
    - {name: add1,  from: [up2, lat1], module: Add,             args: {}}
    - {name: nout,  from: add1,        module: ConvBnAct,       args: {in_ch: 256, out_ch: 256, k: 3}}

    - {name: trunk, from: nout,  module: ConvBnAct, args: {in_ch: 256, out_ch: 256, k: 3}}
    # 4-channel head: ch0 cell_prob, ch1 flow_y, ch2 flow_x, ch3 log_radius
    - {name: raw,   from: trunk, module: Conv,      args: {in_ch: 256, out_ch: 4,  k: 1, bias_init: [0.0, 0.0, 0.0, 0.0]}}

    - {name: prob_r, from: raw,    module: SplitChannels, args: {start: 0, end: 1}}
    - {name: prob,   from: prob_r, module: Sigmoid,       args: {}}
    - {name: fy_r,   from: raw,    module: SplitChannels, args: {start: 1, end: 2}}
    - {name: fy,     from: fy_r,   module: Tanh,          args: {}}
    - {name: fx_r,   from: raw,    module: SplitChannels, args: {start: 2, end: 3}}
    - {name: fx,     from: fx_r,   module: Tanh,          args: {}}
    - {name: rad_r,  from: raw,    module: SplitChannels, args: {start: 3, end: 4}}
    - {name: rad,    from: rad_r,  module: Sigmoid,       args: {}}
    - {name: out,    from: [prob, fy, fx, rad], module: Concat, args: {dim: 1}}

  outputs:
    - {name: output, from: out, activation: none}
